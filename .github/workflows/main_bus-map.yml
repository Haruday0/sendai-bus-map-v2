# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - bus-map

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_C8281B8609C941BDBECF18C07C5BACE0 }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_D027112D16174CF0B2753B0D6FD4418B }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: ./server
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/bus-map-api:${{ github.sha }}
          file: ./server/Dockerfile

  deploy:
    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: "bus-map"
          slot-name: "Production"
          images: "ghcr.io/${{ github.repository_owner }}/bus-map-api:${{ github.sha }}"
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_D2A7ACCE20624F6FB45EB2476C993196 }}
